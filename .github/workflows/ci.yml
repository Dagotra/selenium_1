name: CI Pipeline
on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ruff linter
        uses: astral-sh/ruff-action@v2
        with:
          args: "check ."

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB_AUTH: ${{ vars.POSTGRES_DB_AUTH }}
          POSTGRES_DB_UNIVERSITY: ${{ vars.POSTGRES_DB_UNIVERSITY }}
          AUTH_SERVICE_INTERNAL_URL: ${{ vars.AUTH_SERVICE_INTERNAL_URL }}
          AUTH_SERVICE_API_URL: ${{ vars.AUTH_SERVICE_API_URL }}
          UNIVERSITY_SERVICE_INTERNAL_URL: ${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }}
          UNIVERSITY_SERVICE_API_URL: ${{ vars.UNIVERSITY_SERVICE_API_URL }}
        run: docker compose up -d

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create image api-test
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: api-tests:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha, mode=max


      - name: run api-tests
        run: |
          mkdir -p allure-results
          docker run --network host \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          -e AUTH_SERVICE_API_URL=${{ vars.AUTH_SERVICE_API_URL }} \
          -e UNIVERSITY_SERVICE_API_URL=${{ vars.UNIVERSITY_SERVICE_API_URL }} \
          api-tests --alluredir=allure-results tests/ -s

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 1


  deploy-reports:
    needs: integration-tests
    if: always() && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: ./allure-results

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate ./allure-results -o ./allure-report --clean

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          keep_files: false
